const loader=new GLTFLoader();const cache=new Map();let carregados=0,totalCarga=0;

// ---------- classes ----------
const CLASSES=[
 {k:'Knight',n:'Cavaleiro',d:'Espada e escudo. Aguenta pancada e gira a lâmina no meio do bando.',tex:'knight',hp:150,dano:22,arma:['sword_1handed','shield_badge_color'],tipo:'corpo',combo:['Melee_1H_Attack_Chop','Melee_1H_Attack_Slice_Horizontal','Melee_1H_Attack_Slice_Diagonal'],

 {k:'Barbarian',n:'Bárbaro',d:'Dois machados e fúria. O maior dano corpo a corpo da cripta.',tex:'barbarian',hp:170,dano:26,arma:['axe_1handed','axe_1handed'],tipo:'corpo',combo:['Melee_Dualwield_Attack_Chop','Melee_Dualwield_Attack_Slice','Melee_2H_Attack_Chop'],

 {k:'Mage',n:'Maga',d:'Rajadas arcanas de longe e um meteoro que limpa a sala.',tex:'mage',hp:110,dano:20,arma:['staff'],tipo:'magia',combo:['Ranged_Magic_Shoot'],

 {k:'Ranger',n:'Patrulheiro',d:'Flechas certeiras, rolamento rápido e chuva de flechas.',tex:'ranger',hp:120,dano:19,arma:['bow_withString'],tipo:'flecha',combo:['Ranged_Bow_Release'],
  s:[{n:'Leque',cd:5,a:'leque'},{n:'Rolamento',cd:3,a:'investida'},{n:'Chuva de flechas',cd:9,a:'chuva'}],cab:[],capa:['Ranger_Cape']},
 {k:'Rogue_Hooded',n:'Ladino',d:'Duas adagas, golpes críticos e sombras.',tex:'rogue',hp:120,dano:21,arma:['dagger','dagger'],tipo:'corpo',combo:['Melee_Dualwield_Attack_Stab','Melee_Dualwield_Attack_Slice','Melee_1H_Attack_Stab'],

for(const C of CLASSES){Object.defineProperty(C,'n',{get:()=>tr(`classes.${C.k}.n`)});Object.defineProperty(C,'d',{get:()=>tr(`classes.${C.k}.d`)});C.s.forEach((S,i)=>Object.defineProperty(S,'n',{get:()=>tr(`classes.${C.k}.s`)[i]}))}
const CORES={get length(){return 4}};for(let i=0;i<4;i++)Object.defineProperty(CORES,i,{get:()=>tr('cores')[i]});

// ---------- personagens animados ----------
async function criaBoneco(arquivo,rig){const g=await carrega(arquivo+'.glb');const obj=skClone(g.scene);
 obj.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;o.material=o.material.clone();o.material.emissive=new THREE.Color(0);}});
 const mixer=new THREE.AnimationMixer(obj);const b={obj,mixer,rig,acao:null,nome:''};return b}
function toca(b,nome,{vez=false,fade=.12,vel=1,depois=null}={}){const clip=CLIPS[b.rig][nome];if(!clip)return null;if(b.nome===nome&&!vez)return b.acao;
 const a=b.mixer.clipAction(clip);a.reset();a.setEffectiveTimeScale(vel);a.setEffectiveWeight(1);
 if(vez){a.setLoop(THREE.LoopOnce,1);a.clampWhenFinished=true}else a.setLoop(THREE.LoopRepeat,Infinity);
 if(b.acao&&b.acao!==a)b.acao.fadeOut(fade);a.fadeIn(fade).play();b.acao=a;b.nome=nome;b.fimAcao=depois;return a}
async function armar(b,armas){const slots=['handslotr','handslotl'];for(let i=0;i<armas.length;i++){const w=await peca(armas[i]);const s=b.obj.getObjectByName(slots[i]);if(s){s.add(w)}}}
function brilha(b,cor=0xffffff,t=.09){b.obj.traverse(o=>{if(o.isMesh)o.material.emissive.setHex(cor)});clearTimeout(b._bt);b._bt=setTimeout(()=>b.obj.traverse(o=>{if(o.isMesh)o.material.emissive.setHex(0)}),t*1000)}

// ---------- mapa da cripta ----------
// # parede, . chão, P início, k esqueleto, w guerreiro, m mago, r ladino, O Capitão Ossudo, G Gorrath, C baú, S escada de saída, p pilar, b barris
const MAPA=[
'##############################',
'########..........C.........##',
'########...p..............S.##',
'########..........O.........##',
'########....................##',
'########...p..k.......k.....##',
'########....................##',
'##################..##########',
'##################..##########',
'##################..##########',
'##############..........######',
'##b........###..p..w..p.######',
'##..k...k........k...k..######',
'##.....................m######',
'##....r....###..p..r..p.######',
'##.m.....k.###.m........######',
'#####..#######################',
'#####..#######################',
'#####..#######################',
'###.......####################',
'###.......####################',
'###...P...####################',
'###.......####################',
'##############################'
];
const ALT=MAPA.length,LARG=MAPA[0].length;
const PORTAS=new Map();const pk=(x,z)=>x+','+z;
const ehChao=(x,z)=>{const r=MAPA[z];if(!r)return false;const c=r[x];if(!c||c==='#')return false;const p=PORTAS.get(pk(x,z));return !(p&&p.trancada)};
const solidos=[]; // círculos de colisão {x,z,r}
const salas=[{k:'inicio',x0:3,x1:10,z0:19,z1:23,portas:[],ativa:true,feita:true},{k:'ossuario',x0:2,x1:11,z0:11,z1:16,portas:[[5,16],[6,16],[11,12],[11,13]]},{k:'galeria',x0:14,x1:24,z0:10,z1:16,portas:[[13,12],[13,13],[18,9],[19,9]]},{k:'capitao',x0:8,x1:28,z0:1,z1:7,portas:[[18,7],[19,7]],chefe:true}];
async function montaCripta(){const grupo=new THREE.Group();scene.add(grupo);const promessas=[];
 const pecas=['floor_tile_large','floor_tile_small','floor_tile_small_broken_A','floor_tile_small_weeds_A','floor_tile_big_grate','wall','wall_cracked','wall_arched','wall_inset_candles','wall_pillar','wall_corner','pillar_decorated','torch_mounted','barrel_large','barrel_small','crates_stacked','chest_gold','banner_patternA_red','banner_shield_red','rubble_half','rocks','bookcase_double_decoratedA','table_long_decorated_A','candle_triple','coin_stack_large','column','box_large'];
 const base={};await Promise.all(pecas.map(async p=>{base[p]=await peca(p)}));
 const capG=new THREE.BoxGeometry(4.02,.12,1.02),capM=new THREE.MeshStandardMaterial({color:0x4a423a,roughness:.95});
 const tampa=(x,y,z,ry)=>{const m=new THREE.Mesh(capG,capM);m.position.set(x,y,z);m.rotation.y=ry;m.receiveShadow=true;grupo.add(m)};
 const poe=(p,x,y,z,ry=0,esc=1)=>{const o=base[p].clone(true);o.position.set(x,y,z);o.rotation.y=ry;o.scale.setScalar(esc);grupo.add(o);return o};
 const W=(x,z)=>[(x+.5)*TILE,(z+.5)*TILE];
 const tochas=[];
 for(let z=0;z<ALT;z++)for(let x=0;x<LARG;x++){if(!ehChao(x,z))continue;const [wx,wz]=W(x,z);
  const r=Math.random();if(r<.16){for(const [sx,sz] of [[-1,-1],[1,-1],[-1,1],[1,1]]){const q=Math.random();poe(q<.35?'floor_tile_small_broken_A':q<.5?'floor_tile_small_weeds_A':'floor_tile_small',wx+sx,0,wz+sz,Math.floor(Math.random()*4)*Math.PI/2)}}else poe('floor_tile_large',wx,0,wz,Math.floor(Math.random()*4)*Math.PI/2);
  // paredes nas bordas: atrás (norte) altas, laterais altas, frente (sul) baixas para não tapar a visão
  if(!ehChao(x,z-1)){const q=Math.random();const p=q<.12?'wall_cracked':q<.2?'wall_inset_candles':q<.28?'wall_arched':'wall';poe(p,wx,0,wz-TILE/2);tampa(wx,4.06,wz-TILE/2,0);
   if((x+z)%3===0&&q>.28){tochas.push(poe('torch_mounted',wx,2.6,wz-TILE/2+.5))}else if(q>.86)poe('banner_patternA_red',wx,0,wz-TILE/2+.05)}
  if(!ehChao(x,z+1)){const o=poe('wall',wx,0,wz+TILE/2,Math.PI);o.scale.y=.22;tampa(wx,.94,wz+TILE/2,0)}
  if(!ehChao(x-1,z)){poe('wall',wx-TILE/2,0,wz,Math.PI/2);tampa(wx-TILE/2,4.06,wz,Math.PI/2)}
  if(!ehChao(x+1,z)){poe('wall',wx+TILE/2,0,wz,-Math.PI/2);tampa(wx+TILE/2,4.06,wz,Math.PI/2)}
  const c=MAPA[z][x];
  if(c==='.'&&!ehChao(x,z-1)&&Math.random()<.32){const opc=['barrel_small','box_large','crates_stacked','barrel_large','rubble_half','rocks'];const k=opc[Math.floor(Math.random()*opc.length)];const ox=wx+rand(-1.2,1.2),oz=wz-TILE/2+1.1;poe(k,ox,0,oz,rand(0,Math.PI*2),k==='rubble_half'?.5:1);solidos.push({x:ox,z:oz,r:k==='crates_stacked'||k==='barrel_large'||k==='rocks'?1.1:.7})}
  if(c==='p'){poe('column',wx,0,wz,0,1.9);poe('candle_triple',wx,2.66,wz);solidos.push({x:wx,z:wz,r:.8})}
  if(c==='b'){poe('barrel_large',wx-1,0,wz);poe('barrel_small',wx+.6,0,wz+.8);poe('crates_stacked',wx+1,0,wz-1.2);solidos.push({x:wx,z:wz,r:1.6})}
  if(c==='P'){INICIO.set(wx,0,wz)}
  if(c==='S'){SAIDA.pos=new THREE.Vector3(wx,0,wz);SAIDA.obj=poe('floor_tile_big_grate',wx,.02,wz)}
  if(c==='C'){BAU.pos=new THREE.Vector3(wx,0,wz-1);BAU.obj=poe('chest_gold',wx,0,wz-1);solidos.push({x:wx,z:wz-1,r:1})}
  if('kmrwGO'.includes(c))SPAWNS.push({c,x:wx,z:wz})}
 // enfeites
 const [ix,iz]=W(3,19);poe('bookcase_double_decoratedA',ix+3,0,iz-TILE/2+.35);poe('table_long_decorated_A',ix+20,0,iz+6,Math.PI/2);poe('candle_triple',ix+20,1.9,iz+6);solidos.push({x:ix+20,z:iz+6,r:1.4});
 const [rx,rz]=W(18,1);poe('banner_shield_red',rx-8,0,rz-TILE/2+.06);poe('banner_shield_red',rx+8,0,rz-TILE/2+.06);poe('coin_stack_large',W(9,6)[0],0,W(9,6)[1]);poe('rubble_half',W(15,15)[0],0,W(15,15)[1]+1,.4);poe('rocks',W(27,6)[0],0,W(27,6)[1]);solidos.push({x:W(27,6)[0],z:W(27,6)[1],r:1.4});
 // grades das portas (sobem do chão quando a sala tranca)
 const barG=new THREE.CylinderGeometry(.07,.07,3.6,6),barM=new THREE.MeshStandardMaterial({color:0x2a2622,metalness:.85,roughness:.45});const travG=new THREE.BoxGeometry(4,.14,.14);
 for(const s of salas)for(const [x,z] of s.portas){if(PORTAS.has(pk(x,z)))continue;const [wx,wz]=W(x,z);const gr=new THREE.Group();for(let b=0;b<7;b++){const m=new THREE.Mesh(barG,barM);m.position.set(-1.8+b*.6,1.8,0);m.castShadow=true;gr.add(m)}for(const y of [.6,2.9]){const m=new THREE.Mesh(travG,barM);m.position.y=y;gr.add(m)}
  const vert=!ehChao(x-1,z)&&!ehChao(x+1,z);gr.rotation.y=vert?0:Math.PI/2;gr.position.set(wx,-3.7,wz);scene.add(gr);PORTAS.set(pk(x,z),{x,z,gr,trancada:false,alvo:-3.7})}
 // fogo das tochas
 for(const t of tochas){const p=new THREE.Vector3();t.getWorldPosition(p);p.y+=.75;p.z+=.25;TOCHAS.push({p,fase:Math.random()*10,fogo:criaFogo(p)})}
 grupo.traverse(o=>{if(o.isMesh){o.matrixAutoUpdate=false;o.updateMatrix()}});grupo.updateMatrixWorld(true);}
