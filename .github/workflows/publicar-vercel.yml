# Publica o site no Vercel a cada atualização na branch main.
# Precisa de UM segredo no GitHub: VERCEL_TOKEN (criado em vercel.com/account/tokens).
name: Publicar no Vercel
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_LTV8sbXWJZEgMGwdZJwF63PF
      VERCEL_PROJECT_ID: prj_0dG7HAA8VHLpKvjxgGObWbbvt53p
    steps:
      - uses: actions/checkout@v4
      - name: Publicar
        run: npx --yes vercel@latest deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
